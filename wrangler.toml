name = "cash-advance-non-travel"
account_id = "replace_with_cloudflare_account_id"
main = "cloudflare_worker.js"
compatibility_date = "2024-11-01"

[triggers]
crons = ["* * * * *"] # 1-minute autonomous safety net

[vars]
LARK_APP_ID = "replace_with_lark_app_id"
LARK_BASE_TOKEN = "replace_with_lark_base_token"
LARK_MAIN_TABLE_ID = "replace_with_lark_main_table_id"
LARK_LOG_TABLE_ID = "replace_with_lark_log_table_id"
LARK_APPROVAL_CODE = "replace_with_lark_approval_code"
# Note: LARK_APP_SECRET is provisioned securely via `npx wrangler secret put LARK_APP_SECRET`
